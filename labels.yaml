# The labels every kanso-labs repository carries, and the ones it no longer
# does. PROJECTS.md, under "Labels", says why the list is this short.
labels:
  - color: 'ededed'
    description: A release pull request that has not been released yet
    name: 'autorelease: pending'
  - color: 'ededed'
    description: A release pull request that has been released and tagged
    name: 'autorelease: tagged'
  - color: '0366d6'
    description: Pull requests that update a dependency file
    name: dependencies
  - color: '7057ff'
    description: Good for newcomers
    name: good first issue
  - color: '008672'
    description: Extra attention is needed
    name: help wanted
retired:
  - 'area:*'
  - bug
  - documentation
  - duplicate
  - enhancement
  - invalid
  - 'kind:*'
  - 'platform:*'
  - question
  - wontfix
